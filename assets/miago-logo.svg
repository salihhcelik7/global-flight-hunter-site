<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 10 112 78" width="112" height="78" role="img" aria-label="MIA GO">
  <!--
    MIA GO — the full mark, drawn from the branding reference.

    Four elements, in the order they sit in depth: the M, a globe nested into
    its right counter, a flight path sweeping across both, and the aircraft at
    the end of that path.

    The M is FILLED with mitred corners, not stroked with round ones. That is
    the single biggest difference from the first draft and it is what makes the
    letter read as premium rather than friendly: sharp apexes and flat terminals
    are what the reference does, and rounded joins read as a consumer app.

    The globe sits in the M's right counter and is deliberately cropped by the
    right stem. A globe floating beside the letter would be two logos; a globe
    the letter contains is one. Its meridians are two ellipses and one circle —
    enough to read as a sphere, few enough to survive being scaled down.

    The flight path crosses IN FRONT of the M, and it is the only white element
    in the mark. That contrast is doing the work: gold letter, gold globe, white
    path — so the eye follows the path first and lands on the aircraft, which is
    the only thing in the mark that implies motion.

    This is the mark for the splash, the lockup and anywhere it renders above
    about 64px. Below that, `miago-glyph.svg` drops the globe: three overlapping
    gold shapes at 48px become one gold shape.
  -->
  <defs>
    <linearGradient id="markGold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3E6D2"/>
      <stop offset="0.4" stop-color="#D4AF7C"/>
      <stop offset="1" stop-color="#A87F4A"/>
    </linearGradient>
    <linearGradient id="markGlobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2740"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="markPath" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="66" cy="65" r="16.5"/>
    </clipPath>
  </defs>

  <!-- The M. Filled, mitred, flat terminals. -->
  <path
    d="M 16 82 L 16 20 L 27.5 20 L 50 47 L 72.5 20 L 84 20 L 84 82 L 73 82
       L 73 37 L 53.5 60.5 L 46.5 60.5 L 27 37 L 27 82 Z"
    fill="url(#markGold)"/>

  <!-- The globe, nested in the right counter and cropped by the stem. -->
  <g>
    <circle cx="66" cy="65" r="16.5" fill="url(#markGlobe)"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#D4AF7C" stroke-width="1.3" opacity="0.85">
      <ellipse cx="66" cy="65" rx="16.5" ry="6.3"/>
      <ellipse cx="66" cy="65" rx="6.8" ry="16.5"/>
      <circle cx="66" cy="65" r="15.9" stroke-width="1.1"/>
    </g>
  </g>

  <!--
    The flight path. A single tapered sweep — drawn as a filled shape rather
    than a stroke so it can thin toward its tail, which is what stops it looking
    like a drawn line and starts it looking like motion.
  -->
  <path
    d="M 6 78 C 26 76 46 66 62 50 C 70 42 78 33 88 25
       C 79 36 71 46 63 54 C 47 70 26 80 7 81 Z"
    fill="url(#markPath)"/>

  <!-- The aircraft, at the head of the path. -->
  <g transform="translate(86 22) rotate(-42)">
    <path d="M 0 -8.5 L 2.6 -1 L 11 1.6 L 11 4.2 L 2.6 3 L 2.2 8.4
             L 5.4 10.6 L 5.4 12.4 L 0 11 L -5.4 12.4 L -5.4 10.6
             L -2.2 8.4 L -2.6 3 L -11 4.2 L -11 1.6 L -2.6 -1 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
